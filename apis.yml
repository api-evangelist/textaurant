name: Textaurant
description: >-
  Textaurant was an early SMS-based restaurant waitlist and table-management
  startup founded around 2010 by Josh Bob in Waltham, Massachusetts, and later
  surfaced as a 500 Global portfolio company. Its software let a restaurant
  manage its waiting list from a laptop and text guests when a table opened up,
  positioning itself as a lower-cost alternative to pager-based systems from
  JTECH and OpenTable. The original company is defunct: its primary domain,
  textaurant.com, now resolves to a parked GoDaddy "for sale" landing page with
  no product, documentation, or API surface. A separate, unaffiliated live app
  reusing the name exists at app.textaurant.app (a small Twilio-backed Next.js
  application served through a personal proxy), but it publishes no public API,
  OpenAPI definition, SDK, or developer documentation. There is no API to
  onboard against; this profile is retained as a network record of a defunct
  provider.
